; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Reduce CPU frequency to lower heat generation
; Default: 240MHz, Options: 240, 160, 80, 40, 20, 10 (MHz)
; 160MHz provides good balance - plenty fast for LED animations
board_build.f_cpu = 160000000L

monitor_speed = 115200
monitor_filters =
    time
    send_on_enter
    colorize

lib_deps =
    https://github.com/RemoteXY/RemoteXY-Arduino-library.git
    https://github.com/adafruit/Adafruit_NeoPixel.git
    https://github.com/siteswapjuggler/RAMP.git

; USB upload environment
[env:usb]
extends = env:seeed_xiao_esp32s3
upload_protocol = esptool

; OTA upload environment  
[env:ota]
extends = env:seeed_xiao_esp32s3
upload_protocol = espota
upload_port = TwinklingTree.local
upload_flags =
    --port=3232
    --auth=tree2025


